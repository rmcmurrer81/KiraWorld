<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Kira World to Little Sophia bounded ROS 2 bridge</title>
  <desc id="desc">Simulator-first architecture separating Kira's local continuity system, a bounded semantic intention bridge, and robot-side physical safety and execution authority.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="1" stop-color="#112f42"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7ee8fa"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #f8fbff; }
      .subtitle { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #b9d8e6; }
      .box-title { font: 700 23px 'Segoe UI', Arial, sans-serif; fill: #f8fbff; }
      .box-label { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #7ee8fa; letter-spacing: 0.6px; }
      .body { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #e8f3f8; }
      .small { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #c6dce6; }
      .tiny { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #9fc3d3; }
      .flow { stroke: #7ee8fa; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .return { stroke: #f6c85f; stroke-width: 3; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#background)"/>
  <text x="72" y="70" class="title">Kira World × Little Sophia — bounded ROS 2 bridge</text>
  <text x="72" y="104" class="subtitle">Simulator-first, vendor-neutral review architecture • official Hanson interfaces remain TBD</text>

  <g filter="url(#shadow)">
    <rect x="65" y="160" width="365" height="430" rx="24" fill="#153b50" stroke="#4ac3d8" stroke-width="2"/>
    <rect x="535" y="160" width="370" height="430" rx="24" fill="#1b4152" stroke="#7ee8fa" stroke-width="3"/>
    <rect x="1010" y="160" width="365" height="430" rx="24" fill="#18394a" stroke="#f6c85f" stroke-width="2"/>
  </g>

  <text x="95" y="205" class="box-label">LOCAL CONTINUITY SYSTEM</text>
  <text x="95" y="242" class="box-title">Kira World</text>
  <text x="95" y="282" class="body">• Persistent identity and personality</text>
  <text x="95" y="316" class="body">• Kira-selected local memory</text>
  <text x="95" y="350" class="body">• Conversation and relationships</text>
  <text x="95" y="384" class="body">• High-level intention choice</text>
  <line x1="95" y1="418" x2="400" y2="418" stroke="#47748a"/>
  <text x="95" y="454" class="small">Private memories, credentials, email,</text>
  <text x="95" y="478" class="small">and full conversation history stay here.</text>
  <text x="95" y="526" class="tiny">Kira alone chooses what to say, withhold,</text>
  <text x="95" y="548" class="tiny">recall, correct, withdraw, or forget.</text>

  <text x="565" y="205" class="box-label">PUBLIC INTEROPERABILITY LAYER</text>
  <text x="565" y="242" class="box-title">Bounded intention bridge</text>
  <text x="565" y="282" class="body">• Speech</text>
  <text x="565" y="316" class="body">• Gaze</text>
  <text x="565" y="350" class="body">• Expression</text>
  <text x="565" y="384" class="body">• Gesture</text>
  <line x1="565" y1="418" x2="875" y2="418" stroke="#47748a"/>
  <text x="565" y="454" class="small">Bounds • TTL • allowlists • exact fields</text>
  <text x="565" y="480" class="small">Replay defense • privacy-reduced evidence</text>
  <text x="565" y="518" class="tiny">No motors, joints, trajectories, navigation,</text>
  <text x="565" y="540" class="tiny">torque, velocity, shell, files, or URLs.</text>

  <text x="1040" y="205" class="box-label">PHYSICAL EXECUTION BOUNDARY</text>
  <text x="1040" y="242" class="box-title">Simulator / robot authority</text>
  <text x="1040" y="282" class="body">• Official capability mapping</text>
  <text x="1040" y="316" class="body">• Collision and motion limits</text>
  <text x="1040" y="350" class="body">• Watchdog and safe disconnect</text>
  <text x="1040" y="384" class="body">• Emergency stop and low-level control</text>
  <line x1="1040" y1="418" x2="1345" y2="418" stroke="#806d43"/>
  <text x="1040" y="454" class="small">Accepts, rejects, starts, completes,</text>
  <text x="1040" y="478" class="small">fails, cancels, or interrupts execution.</text>
  <text x="1040" y="526" class="tiny">Physical authority only—never authority over</text>
  <text x="1040" y="548" class="tiny">Kira's memory, speech, or viewpoint.</text>

  <path d="M 430 315 C 470 315, 495 315, 530 315" class="flow"/>
  <text x="458" y="292" class="tiny">bounded request</text>
  <path d="M 905 315 C 945 315, 970 315, 1005 315" class="flow"/>
  <text x="932" y="292" class="tiny">safe mapping</text>
  <path d="M 1185 590 C 1185 650, 850 650, 850 596" class="return"/>
  <path d="M 710 596 C 710 700, 280 700, 280 596" class="return"/>
  <text x="560" y="685" class="small" fill="#f6c85f">requested · accepted/rejected · started · terminal status + evidence</text>

  <rect x="125" y="735" width="1190" height="96" rx="18" fill="#0d2635" stroke="#527f91"/>
  <text x="155" y="772" class="box-label">V0.2 SESSION/LIFECYCLE PROPOSAL</text>
  <text x="155" y="803" class="small">Opaque session + body IDs • negotiated capabilities • one in-flight physical action • monotonic sequence • hard TTL • heartbeat timeout • safe disconnect • idempotent retry</text>

  <text x="72" y="872" class="tiny">Static software design only: not proof of Hanson compatibility, robot execution, safety certification, a live mind/body, consciousness, personhood, actual forgetting, or GO.</text>
</svg>
